name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loc-gate:
    name: LOC gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enforce the single-file LOC gate
        run: ./scripts/lint_loc_gate.sh

  swift-build:
    name: Swift package build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Show the toolchain
        run: swift --version
      - name: Build the application and the library products
        run: swift build
